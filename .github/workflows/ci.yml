name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Validate manifests and run the unit tests (a fake bb)
        run: npm test

  # The provider against the pinned bb-app (test/contract/bb-version), in a container, with
  # a mock Anthropic endpoint: no credential. bb's API has no login, so bb runs only
  # inside that container and no port is published.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract test against the pinned bb-app
        run: npm run test:contract
