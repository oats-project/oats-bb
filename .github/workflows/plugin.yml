# The plugin's CI job: typecheck, unit tests (A1 to A12), build, then bb-app at the pinned version
# with the plugin installed and a fake oats (A13 to A15), all inside one container
# (plugin/container/ci.sh; plugin/container/README.md).
name: plugin
on:
  pull_request:
    paths:
      - "plugin/**"
      - "bb-version"
      - ".github/workflows/plugin.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "bb-version"
      - ".github/workflows/plugin.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: plugin/container/ci.sh all
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-live
          path: plugin/container/out/
