# The plugin's CI: the stages of plugin/container/ci.sh as jobs side by side, each in a container
# of its own on a runner of its own, so that the wall time is the longest job's and not their sum
# (as one job, `ci.sh all`, it took 26 to 45 minutes and was once cancelled at 45):
#   plugin-unit       `ci.sh unit`: typecheck, unit tests (A1 to A12), build
#   test              `ci.sh live` in bb's LIGHT theme (LIVE_THEMES=light): bb-app at the pinned
#                     version with the plugin installed and a fake oats (A13 to A15), the live
#                     scenes and their images at both widths
#   plugin-live-dark  the same live stage in bb's DARK theme (LIVE_THEMES=dark)
#   plugin-real       `ci.sh real`: the run against a real OATS kernel from npm and the bb session
#                     provider of this checkout
# (plugin/container/README.md; plugin/container/real/README.md). Each job installs and builds what
# it needs by itself: none waits for another. The live stage is two jobs because it is the longest
# by far and every scene runs in both themes at both widths: as one job it took 41 min 36 s of its
# limit of 60 (the two themes cost the same), as two each draws half of the scenes. One comparison
# is narrower for it: "no two images of this run are the same image" is within a theme, no longer
# between a light image and a dark one (plugin/container/README.md). The live and the real
# jobs keep their files as the artefacts `plugin-live`, `plugin-live-dark` and `plugin-real` (the
# unit stage writes none). The light live job keeps the name `test`, the one job this workflow
# had: a required status check bound to that name keeps a job to wait for. A repository that
# requires the plugin's checks requires all of them.
# One more job, of the same shape, is the pi run:
#   plugin-pi    `ci.sh pi`: a pi agent launched from the New agent form, in the real run's container
#                with pi, the OATS bridge for pi and a mock model (plugin/container/real/pi/README.md)
name: plugin
on:
  pull_request:
    paths:
      - "plugin/**"
      - "oats-package/**"
      - "bb-version"
      - ".github/workflows/plugin.yml"
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "oats-package/**"
      - "bb-version"
      - ".github/workflows/plugin.yml"
permissions:
  contents: read
jobs:
  plugin-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No artefact: the unit stage writes no file, its output is this job's log.
      - run: plugin/container/ci.sh unit
  # The live stage in bb's light theme. Its name stays `test` (above).
  test:
    runs-on: ubuntu-latest
    # The limits are above what a slow runner needs, not targets.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: LIVE_THEMES=light plugin/container/ci.sh live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-live
          path: plugin/container/out/
  # The live stage in bb's dark theme: the same checks and scenes, the other theme's images.
  plugin-live-dark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: LIVE_THEMES=dark plugin/container/ci.sh live
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-live-dark
          path: plugin/container/out/
  plugin-real:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: plugin/container/ci.sh real
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-real
          path: plugin/container/real/out/
  # The pi run: not a stage of `ci.sh all`, a run of its own beside the real run.
  plugin-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: plugin/container/ci.sh pi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: plugin-pi
          path: plugin/container/real/pi/out/
