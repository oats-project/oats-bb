# The bb session provider (oats-package/): its unit tests and its contract test.
# Both read the bb-app pin from the repository's bb-version file.
name: provider

# A pull request runs these jobs when it changes what the provider's tests read: the provider, the tests, the
# scripts, the pin, package.json, plugin/package.json (test/unit/container-pin.test.mjs pins its bb-app),
# container/** and container.yml (the image's unit tests), and this file. A plugin-only or docs-only pull request
# does not; plugin.yml proves those. Every push to main runs them all.
on:
  pull_request:
    paths:
      - "oats-package/**"
      - "test/**"
      - "scripts/**"
      - "bb-version"
      - "package.json"
      - "plugin/package.json"
      - "container/**"
      - ".github/workflows/container.yml"
      - ".github/workflows/provider.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      # Each Node version reports for itself: one failing does not cancel the other.
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Validate manifests (the version default equals bb-version) and run the unit tests (a fake bb)
        run: npm test

  # The provider against the pinned bb-app (bb-version), in a container, with
  # a mock Anthropic endpoint: no credential. bb's API has no login, so bb runs only
  # inside that container and no port is published.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The second contract file runs Claude Code's sandbox inside its container: bubblewrap
      # makes a user namespace there, and Claude Code's seccomp helper another inside it.
      # Ubuntu's AppArmor forbids the inner one: it attaches a profile to /usr/bin/bwrap by
      # its path (bwrap-userns-restrict), which the container's bwrap matches too, since the
      # container runs unconfined. Lifting the sysctl alone was not enough (tried); with
      # the two profiles unloaded the sandbox starts. This is the job's own runner, thrown
      # away after it.
      - name: Let the contract container make user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          for profile in bwrap-userns-restrict unprivileged_userns; do
            if [ -e /etc/apparmor.d/$profile ]; then sudo apparmor_parser -R /etc/apparmor.d/$profile && echo "removed $profile"; fi
          done
      - name: Contract test against the pinned bb-app
        run: npm run test:contract
